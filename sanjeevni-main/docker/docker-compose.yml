version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: medsecure_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///database/medsecure.db
      - MEDSECURE_JWT_SECRET=medsecure-production-ready-jwt-secret-key-32b
      - MEDSECURE_FERNET_KEY=uEw8sWpS2x7kZ0h_4Z8mP-6v9T2qY5bE1wX4rT7yK0E=
    volumes:
      - ../database:/app/database
      - ../uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: medsecure_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
